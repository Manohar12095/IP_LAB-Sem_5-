<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Portal - User Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Job Portal - Job Seeker Registration</h1>

    <form id="registerForm" onsubmit="return validateForm()">

        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Full Name" required>

        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="Email" required>

        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" placeholder="10 digit phone number" required>

        <label for="dob">Date of Birth:</label>
        <input type="text" id="dob" placeholder="DD-MM-YYYY" required>

        <label for="address">Address:</label>
        <input type="text" id="address" placeholder="Address" required>

        <label for="resume">Upload Resume (PDF/DOC/DOCX):</label>
        <input type="file" id="resume" required>

        <div id="errorBox" class="error"></div>

        <button type="submit">Register</button>

    </form>

    <div id="successMsg" class="success"></div>
</div>

<script src="script.js"></script>
</body>
</html>
